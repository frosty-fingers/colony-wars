                setCardPlayAvailable(true);
                setMoveAvailable(false); // first player doesn't get a move on turn 1
                setCardPlayedThisTurn(false);
                setBonusCapNextTurn(0);
                setResourceCap(capForTurn(1, settings.resourceCurve));
                setResources(capForTurn(1, settings.resourceCurve));
                setTurn(1);
                const winConditionMsg = settings.winCondition === 'annihilation'
                    ? 'Wipe out every Rival tile to win.'
                    : settings.winCondition === 'holdTurn'
                        ? 'Capture the enemy Nest AND hold it through their turn to win.'
                        : 'Capture the enemy Nest to win.';
                setGameLog(['=== COLONY WARS ===', winConditionMsg, 'Turn 1: card only -- no move (first-turn balance).']);
                setPhase('planning');
                setGameOver(false);
                setWinner(null);
                setPendingCapture(null);
                setHistory([]);
                setRivalBonusCapNextTurn(0);
                setAwaitingHandoff(false);
                setHandoffLink('');
                setHandoffLinkCopied(false);
                setBoardFlipped(false);
            };

            const copyShareLink = async () => {
                const url = buildShareUrl(settings, playerTribeKey, rivalTribeKey);
                try {
                    await navigator.clipboard.writeText(url);
                    setShareLinkCopied(true);
                    setShareLinkText('');
                    setTimeout(() => setShareLinkCopied(false), 2500);
                } catch (err) {
                    // Clipboard API blocked (common outside HTTPS/localhost) -- show the
                    // link as selectable text so it can still be copied by hand.
                    setShareLinkText(url);
                }
            };

            const copyHandoffLink = async () => {
                try {
                    await navigator.clipboard.writeText(handoffLink);
                    setHandoffLinkCopied(true);
                    setTimeout(() => setHandoffLinkCopied(false), 2500);
                } catch (err) {
                    // Fallback handled by the always-visible selectable text below the button
                }
            };

            const continueLocally = () => {
                window.location.href = handoffLink; // full reload -- re-parses the link fresh, same as opening it on a second device
            };

            const lastLogLine = gameLog[gameLog.length - 1] || '';

            const displayRows = boardFlipped
                ? [...ROW_LAYOUT].reverse().map(row => [...row].reverse())
                : ROW_LAYOUT;

            const highlightSet = React.useMemo(() => {
                const set = new Set();
                if (mustDiscard) return set;
                if (dumpMode === 'jump-target' && dumpSource !== null) {
                    jumpTargetsFrom(dumpSource).forEach(n => set.add(n));
                    return set;
                }
                if (dumpMode === 'web-target') {
                    map.forEach((t, i) => {
                        if (t.tribe.name === 'RIVAL' && adjacentToTribe(map, i, 'ANT')) set.add(i);
                    });
                    return set;
                }
                if (dumpMode) return set;
                if (selectedCard !== null) {
                    map.forEach((t, i) => {
                        if (t.tribe.name === 'ANT') set.add(i);
                    });
                } else if (moveSource !== null) {
                    movementTargets(moveSource, playerTribeKey, abilityArmed).forEach(n => set.add(n));
                }
                return set;
            }, [selectedCard, moveSource, map, mustDiscard, dumpMode, dumpSource, playerTribeKey, abilityArmed]);

            if (screen === 'menu') {
                return (
                    <div className="game-container">
                        <div className="main-col">
                            <div className="header">
                                <div className="header-col"><b>🐜 COLONY WARS 🐝</b></div>
                            </div>

                            <div className="objective">
                                Capture (or hold, or annihilate) the Rival colony.<br />
                                Pick your tribe and theirs -- defaults to Ant vs Ant.
                            </div>

                            <div className="settings-section">
                                <div className="settings-title">Your Tribe</div>
                                <div className="tribe-grid">
                                    {Object.entries(TRIBE_CONFIGS).map(([key, t]) => (
                                        <button
                                            key={key}
                                            className={'tribe-btn' + (playerTribeKey === key ? ' selected-setting' : '')}
                                            onClick={() => setPlayerTribeKey(key)}
                                        >
                                            <div style={{ fontSize: '16px' }}>{t.emoji}</div>
                                            <div>{key}</div>
                                        </button>
                                    ))}
                                </div>
                                <div className="info-text" style={{ marginTop: '4px' }}>
                                    {TRIBE_CONFIGS[playerTribeKey].style}/{TRIBE_CONFIGS[playerTribeKey].power}/{TRIBE_CONFIGS[playerTribeKey].speed} — {TRIBE_CONFIGS[playerTribeKey].mechanic}
                                </div>
                            </div>

                            <div className="settings-section">
                                <div className="settings-title">Rival Tribe</div>
                                <div className="tribe-grid">
                                    {Object.entries(TRIBE_CONFIGS).map(([key, t]) => (
                                        <button
                                            key={key}
                                            className={'tribe-btn' + (rivalTribeKey === key ? ' selected-setting' : '')}
                                            onClick={() => setRivalTribeKey(key)}
                                        >
                                            <div style={{ fontSize: '16px' }}>{t.emoji}</div>
                                            <div>{key}</div>
                                        </button>
                                    ))}
                                </div>
                                <div className="info-text" style={{ marginTop: '4px' }}>
                                    {TRIBE_CONFIGS[rivalTribeKey].style}/{TRIBE_CONFIGS[rivalTribeKey].power}/{TRIBE_CONFIGS[rivalTribeKey].speed} — {TRIBE_CONFIGS[rivalTribeKey].mechanic}
                                </div>
                            </div>

                            <button
                                className="control-btn confirm"
                                style={{ width: '100%', padding: '16px' }}
                                onClick={() => { setAsyncMode(false); resetGame(); setScreen('game'); }}
                            >
                                ▶ Start Game (vs AI)
                            </button>
                            <button
                                className="control-btn confirm"
                                style={{ width: '100%', padding: '14px' }}
                                onClick={() => { setAsyncMode(true); resetGame(); setScreen('game'); }}
                            >
                                🌐 Play by Link (vs a friend)
                            </button>
                            <button
                                className="control-btn"
                                style={{ width: '100%' }}
                                onClick={() => setScreen('settings')}
                            >
                                ⚙ Game Options
                            </button>

                            <div className="info-text">Matchup: {TRIBE_CONFIGS[playerTribeKey].emoji} {playerTribeKey} vs {TRIBE_CONFIGS[rivalTribeKey].emoji} {rivalTribeKey} ⋅ {settings.smartAI ? 'Smart' : 'Original'} AI ⋅ Sickness {settings.summoningSickness ? 'On' : 'Off'} ⋅ {NEST_LAYOUTS[settings.nestLayout].label} nests ⋅ {settings.winCondition} win ⋅ {NEST_GARRISON_LEVELS[settings.nestGarrison].label} ⋅ Banking {settings.workerBanking ? 'On' : 'Off'}</div>

                            <button
                                className="control-btn"
                                style={{ width: '100%' }}
                                onClick={copyShareLink}
                            >
                                {shareLinkCopied ? '✓ Link copied!' : '🔗 Copy Share Link (this config)'}
                            </button>
                            {shareLinkText && (
                                <div className="info-text" style={{ wordBreak: 'break-all' }}>{shareLinkText}</div>
                            )}
                        </div>
                    </div>
                );
            }

            if (screen === 'settings') {
                return (
                    <div className="game-container">
                        <div className="main-col">
                            <div className="header">
                                <div className="header-col"><b>⚙ GAME OPTIONS</b></div>
                            </div>

                            <div className="settings-section">
                                <div className="settings-title">Rival AI Behavior</div>
                                <div className="settings-options">
                                    <button
                                        className={'control-btn' + (settings.smartAI ? ' selected-setting' : '')}
                                        onClick={() => setSettings(s => ({ ...s, smartAI: true }))}
                                    >
                                        Smart (advances on your push)
                                    </button>
                                    <button
                                        className={'control-btn' + (!settings.smartAI ? ' selected-setting' : '')}
                                        onClick={() => setSettings(s => ({ ...s, smartAI: false }))}
                                    >
                                        Original (expands blindly)
                                    </button>
                                </div>
                            </div>

                            <div className="settings-section">
                                <div className="settings-title">Summoning Sickness</div>
                                <div className="settings-options">
                                    <button
                                        className={'control-btn' + (settings.summoningSickness ? ' selected-setting' : '')}
                                        onClick={() => setSettings(s => ({ ...s, summoningSickness: true }))}
                                    >
                                        On (can't move a tile the turn it's summoned to)
                                    </button>
                                    <button
                                        className={'control-btn' + (!settings.summoningSickness ? ' selected-setting' : '')}
                                        onClick={() => setSettings(s => ({ ...s, summoningSickness: false }))}
                                    >
                                        Off (play + push same turn allowed)
                                    </button>
                                </div>
                            </div>

                            <div className="settings-section">
                                <div className="settings-title">Nest Layout</div>
                                <div className="settings-options">
                                    {Object.entries(NEST_LAYOUTS).map(([key, layout]) => (
                                        <button
                                            key={key}
                                            className={'control-btn' + (settings.nestLayout === key ? ' selected-setting' : '')}
                                            onClick={() => setSettings(s => ({ ...s, nestLayout: key }))}
                                        >
                                            {layout.label} — {layout.desc}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="settings-section">
                                <div className="settings-title">Win Condition</div>
                                <div className="settings-options">
                                    <button
                                        className={'control-btn' + (settings.winCondition === 'instant' ? ' selected-setting' : '')}
                                        onClick={() => setSettings(s => ({ ...s, winCondition: 'instant' }))}
                                    >
                                        Instant Capture — taking the Nest wins immediately
                                    </button>
                                    <button
                                        className={'control-btn' + (settings.winCondition === 'holdTurn' ? ' selected-setting' : '')}
                                        onClick={() => setSettings(s => ({ ...s, winCondition: 'holdTurn' }))}
                                    >
                                        Capture &amp; Hold — must hold it through their next turn
                                    </button>
                                    <button
                                        className={'control-btn' + (settings.winCondition === 'annihilation' ? ' selected-setting' : '')}
                                        onClick={() => setSettings(s => ({ ...s, winCondition: 'annihilation' }))}
                                    >
                                        Annihilation — wipe out every enemy tile, Nest capture alone doesn't win
                                    </button>
                                </div>
                            </div>

                            <div className="settings-section">
                                <div className="settings-title">Nest Garrison</div>
                                <div className="settings-options">
                                    {Object.entries(NEST_GARRISON_LEVELS).map(([key, level]) => (
                                        <button
                                            key={key}
                                            className={'control-btn' + (settings.nestGarrison === key ? ' selected-setting' : '')}
                                            onClick={() => setSettings(s => ({ ...s, nestGarrison: key }))}
                                        >
                                            {level.label} — {level.desc}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="settings-section">
                                <div className="settings-title">Worker Egg Banking</div>
                                <div className="settings-options">
                                    <button
                                        className={'control-btn' + (settings.workerBanking ? ' selected-setting' : '')}
                                        onClick={() => setSettings(s => ({ ...s, workerBanking: true }))}
                                    >
                                        On — playing a Worker also banks this turn's leftover eggs into next turn's cap
                                    </button>
                                    <button
                                        className={'control-btn' + (!settings.workerBanking ? ' selected-setting' : '')}
                                        onClick={() => setSettings(s => ({ ...s, workerBanking: false }))}
                                    >
                                        Off — unspent eggs are always lost at end of turn, Worker only gives its flat +1
                                    </button>
                                </div>
                            </div>

                            <div className="settings-section">
                                <div className="settings-title">Turn Order</div>
                                <div className="settings-options">
                                    <button
                                        className={'control-btn' + (settings.alternatingFirstPlayer ? ' selected-setting' : '')}
                                        onClick={() => setSettings(s => ({ ...s, alternatingFirstPlayer: true }))}
                                    >
                                        Alternating — whoever went second last round goes first this round (sequence: You/Rival, Rival/You, You/Rival... so whoever's due gets two turns in a row)
                                    </button>
                                    <button
                                        className={'control-btn' + (!settings.alternatingFirstPlayer ? ' selected-setting' : '')}
                                        onClick={() => setSettings(s => ({ ...s, alternatingFirstPlayer: false }))}
                                    >
                                        Fixed — you always go first, every round
                                    </button>
                                </div>
                            </div>

                            <div className="settings-section">
                                <div className="settings-title">Resource Curve</div>
                                <div className="settings-options">
                                    {Object.entries(RESOURCE_CURVES).map(([key, curve]) => (
                                        <button
                                            key={key}
                                            className={'control-btn' + (settings.resourceCurve === key ? ' selected-setting' : '')}
                                            onClick={() => setSettings(s => ({ ...s, resourceCurve: key }))}
                                        >
                                            {curve.label} — {curve.desc}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="action-row">
                                <button
                                    className="control-btn"
                                    onClick={() => setScreen('menu')}
                                >
                                    ◀ Back to Menu
                                </button>
                                <button
                                    className="control-btn confirm"
                                    onClick={() => { resetGame(); setScreen('game'); }}
                                >
                                    ▶ Start Game
                                </button>
                            </div>

                            <div className="info-text">Change these any time from the game-over screen.</div>
                        </div>
                    </div>
                );
            }

            if (awaitingHandoff) {
                return (
                    <div className="game-container">
                        <div className="main-col">
                            <div className="header">
                                <div className="header-col"><b>🌐 TURN COMPLETE</b></div>
                            </div>

                            <div className="objective">
                                Send this link to your opponent so they can take their turn.<br />
                                Playing on the same device? Hit Continue Here instead.
                            </div>

                            <button
                                className="control-btn confirm"
                                style={{ width: '100%', padding: '14px' }}
                                onClick={copyHandoffLink}
                            >
                                {handoffLinkCopied ? '✓ Link copied!' : '🔗 Copy Link for Opponent'}
                            </button>
                            <div className="info-text" style={{ wordBreak: 'break-all' }}>{handoffLink}</div>

                            <button
                                className="control-btn"
                                style={{ width: '100%' }}
                                onClick={continueLocally}
                            >
                                ▶ Continue Here (same device)
                            </button>
                            <button
                                className="control-btn"
                                style={{ width: '100%' }}
                                onClick={() => setScreen('menu')}
                            >
                                🏠 Main Menu
                            </button>

                            <div className="log">
                                <div className="log-title">Battle Log</div>
                                {gameLog.map((line, i) => <div key={i} className="log-line">{line}</div>)}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="game-container">
                    <div className="main-col">
                    <div className="header">
                        <div className="header-col">
                            <button
                                className="control-btn"
                                style={{ fontSize: '8px', padding: '3px 6px', marginBottom: '3px' }}
                                onClick={() => {
                                    if (window.confirm('Leave this game and return to the main menu?')) setScreen('menu');
                                }}
                            >
                                🏠 Menu
                            </button><br />
                            TURN <b>{turn}</b><br />
                            {phase === 'enemy_turn' ? 'RIVAL TURN' : 'YOUR TURN'}
                        </div>
                        <div className="header-col" style={{ textAlign: 'right' }}>
                            EGGS <b>{resources}</b>/{resourceCap} 🥚<br />
                            CARD {cardPlayAvailable ? '✓' : '✗'} ⋅ MOVE {moveAvailable ? '✓' : '✗'}
                            {abilityArmed && <span style={{ color: '#FFD700' }}> ⋅ ⚡ARMED</span>}
                        </div>
                    </div>

                    <div className={
                        'last-action' +
                        (/YOU WIN|CAPTURED!|Victory|reinforce in time|held/i.test(lastLogLine) && !/Rival/i.test(lastLogLine) ? ' good' : '') +
                        (/YOU LOSE|Rival captured|Rival attacked and won|Attack failed/i.test(lastLogLine) ? ' bad' : '')
                    }>
                        {lastLogLine}
                    </div>

                    <div className="objective">
                        {settings.winCondition === 'annihilation'
                            ? '🎯 Wipe out every RIVAL tile to win. Nest capture alone won\'t end it!'
                            : settings.winCondition === 'holdTurn'
                                ? '🎯 Capture the RIVAL Nest AND hold it through their turn to win.'
                                : '🎯 Capture the RIVAL Nest (top) to win. Defend yours (bottom)!'}
                        <br />
                        1 card + 1 move/turn ⋅ leftover eggs 🥚 can be dumped for a bonus
                        {pendingCapture && (
                            <div style={{ marginTop: '4px', color: pendingCapture.winner === 'ANT' ? '#FFD700' : '#FF6B6B' }}>
                                {pendingCapture.winner === 'ANT'
                                    ? '⚡ Holding Rival Nest -- survive their turn to win!'
                                    : '⚠ Rival holds YOUR Nest -- retake it now!'}
                            </div>
                        )}
                    </div>

                    <div className="board">
                        {displayRows.map((row, rowIdx) => (
                            <div className="board-row" key={rowIdx}>
                                {row.map(idx => {
                                    const territory = map[idx];
                                    return (
                                        <div
                                            key={idx}
                                            className={
                                                'territory' +
                                                (territory.type === TERRITORY_TYPES.NEST ? ' is-nest' : '') +
                                                (idx === moveSource || idx === dumpSource ? ' move-source' : '') +
                                                (highlightSet.has(idx) ? ' valid-target' : '') +
                                                (mustDiscard ? ' discard-mode' : '')
                                            }
                                            onClick={() => onTileClick(idx)}
                                            style={{ color: territory.tribe.color, '--owner-border': territory.tribe.color }}
                                        >
                                            <div className="t-icon">
                                                {territory.tribe.name === 'ANT' ? TRIBE_CONFIGS[playerTribeKey].emoji
                                                    : territory.tribe.name === 'RIVAL' ? TRIBE_CONFIGS[rivalTribeKey].emoji
                                                        : (territory.type === TERRITORY_TYPES.NEST ? NEST_EMOJI : '')}
                                            </div>
                                            <div className="t-type">{territory.type === TERRITORY_TYPES.NEST ? `${NEST_EMOJI} NEST` : 'GRD'}</div>
                                            <div className="t-units">{territory.units > 0 ? territory.units : '\u00A0'}</div>
                                            <div className="t-trait">
                                                {[
                                                    territory.trait ? TRAIT_ICON[territory.trait] : null,
                                                    (settings.summoningSickness && idx === summonedTileThisTurn) ? '💤' : null,
                                                    territory.webbed ? '🕸️' : null,
                                                ].filter(Boolean).join(' ') || '\u00A0'}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        ))}
                    </div>

                    <div className="hand">
                        {hand.map((card, idx) => (
                            <div
                                key={card.uid}
                                className={
                                    'card' +
                                    (selectedCard === idx ? ' selected' : '') +
                                    (mustDiscard ? ' discard-target' : '') +
                                    (!mustDiscard && (resources < card.cost || !cardPlayAvailable) ? ' unaffordable' : '')
                                }
                                onClick={() => onCardClick(idx)}
                            >
                                <div className="card-name">{card.name}</div>
                                <div className="card-stats">{card.cost}🥚 / {card.power}⚔</div>
                                <div className="card-effect">{card.effect}</div>
                            </div>
                        ))}
                    </div>

                    <div className="action-panel">
                    {mustDiscard ? (
                        <div className="discard-notice">⚠ Tap a card above to discard it and end your turn</div>
                    ) : dumpMode === 'jump-source' ? (
                        <div className="action-row">
                            <div className="discard-notice" style={{ gridColumn: '1 / -1' }}>🐝 Tap a unit stack to launch Wing Jump from</div>
                        </div>
                    ) : dumpMode === 'jump-target' ? (
                        <div className="action-row">
                            <button className="control-btn" onClick={() => { setDumpMode(null); setDumpSource(null); }}>
                                Cancel Jump
                            </button>
                            <div className="info-text" style={{ alignSelf: 'center' }}>Tap a glowing tile to land</div>
                        </div>
                    ) : dumpMode === 'fortify-target' ? (
                        <div className="action-row">
                            <button className="control-btn" onClick={() => setDumpMode(null)}>
                                Cancel
                            </button>
                            <div className="info-text" style={{ alignSelf: 'center' }}>Tap your tile to fortify</div>
                        </div>
                    ) : dumpMode === 'web-target' ? (
                        <div className="action-row">
                            <button className="control-btn" onClick={() => setDumpMode(null)}>
                                Cancel
                            </button>
                            <div className="info-text" style={{ alignSelf: 'center' }}>Tap an adjacent enemy tile to web</div>
                        </div>
                    ) : (
                        <React.Fragment>
                            {selectedCard === null && moveSource === null && playerProfile.dumpType && (
                                <button
                                    className="control-btn confirm"
                                    style={{ width: '100%' }}
                                    onClick={startDump}
                                    title={DUMP_DESCRIPTIONS[playerProfile.dumpType]}
                                    disabled={
                                        gameOver ||
                                        (playerProfile.dumpType === 'generate' ? resources < playerProfile.dumpMin : resources < playerProfile.dumpCost)
                                    }
                                >
                                    ⚡ Dump: {playerProfile.dumpLabel} {playerProfile.dumpType === 'generate' ? `(need ${playerProfile.dumpMin}+, get +${resources})` : `(${playerProfile.dumpCost}🥚)`}
                                </button>
                            )}
                            {selectedCard === null && moveSource === null && (
                                <div className="info-text" style={{ marginTop: '-4px' }}>
                                    {playerProfile.dumpType ? DUMP_DESCRIPTIONS[playerProfile.dumpType] : playerProfile.mechanic}
                                </div>
                            )}
                            <div className="action-row three-col">
                                <button
                                    className="control-btn"
                                    onClick={undo}
                                    disabled={gameOver || phase !== 'planning' || history.length === 0}
                                    title="Undo your last card play or move this turn"
                                >
                                    ↩ Undo
                                </button>
                                <button
                                    className="control-btn"
                                    onClick={() => { setSelectedCard(null); setMoveSource(null); }}
                                    disabled={gameOver || (selectedCard === null && moveSource === null)}
                                >
                                    Cancel Selection
                                </button>
                                <button
                                    className="control-btn"
                                    onClick={onEndTurnClick}
                                    disabled={gameOver || phase !== 'planning'}
                                >
                                    End Turn
                                </button>
                            </div>
                        </React.Fragment>
                    )}
                    </div>

                    {gameOver && (
                        <div>
                            <div className="game-over">
                                {winner === 'ANT'
                                    ? `${TRIBE_CONFIGS[playerTribeKey].emoji} VICTORY! ${TRIBE_CONFIGS[playerTribeKey].emoji}`
                                    : `${TRIBE_CONFIGS[rivalTribeKey].emoji} DEFEAT ${TRIBE_CONFIGS[rivalTribeKey].emoji}`}
                            </div>
                            <button className="restart-btn" onClick={resetGame} style={{ marginTop: '6px' }}>Play Again (same settings)</button>
                            <button className="restart-btn" onClick={() => setScreen('settings')} style={{ marginTop: '6px' }}>⚙ Game Options</button>
                            <button className="restart-btn" onClick={() => setScreen('menu')} style={{ marginTop: '6px' }}>🏠 Main Menu</button>
                        </div>
                    )}

                    <div className="info-text">
                        {mustDiscard
                            ? 'You must play or discard a card every turn.'
                            : selectedCard !== null
                                ? 'Tap one of your own tiles to summon this card there.'
                                : moveSource !== null
                                    ? 'Tap a highlighted neighbor to move/attack there.'
                                    : 'Summon only onto captured squares. 1 card + 1 move per turn.'}
                    </div>
                    </div>

                    <div className="log" ref={logRef}>
                        <div className="log-title">Battle Log</div>
                        {gameLog.map((line, i) => <div key={i} className="log-line">{line}</div>)}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ColonyWars />);
    </script>
</body>
</html>
